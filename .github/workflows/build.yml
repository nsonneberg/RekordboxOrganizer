name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m unittest -v

      - name: Stamp the version (lets the app spot newer releases)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onefile --windowed --collect-all pyrekordbox --name "Rekordbox Organizer" app.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --collect-all pyrekordbox --name "Rekordbox Organizer" app.py
          cd dist && ditto -c -k --keepParent "Rekordbox Organizer.app" "Rekordbox Organizer-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-organizer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip

  # On a version tag (v1.0.0, ...), publish both builds as a GitHub Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp "artifacts/rekordbox-organizer-Windows/Rekordbox Organizer.exe" release/Rekordbox-Organizer-Windows.exe
          cp "artifacts/rekordbox-organizer-macOS/Rekordbox Organizer-macOS.zip" release/Rekordbox-Organizer-macOS.zip
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "Rekordbox Organizer $GITHUB_REF_NAME" --generate-notes
